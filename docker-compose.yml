version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Docker build sırasında /api geçilir → Nginx üzerinden backend'e yönlenir
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: "177597941513-u7madsiab1pu64q9hgnn0im79ge0qf8o.apps.googleusercontent.com"
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: "postgresql://postgres:root@db:5432/jet-grout-calc"
      JWT_SECRET: "jg-calc-secret-key-2026-change-in-production"
      ALLOWED_ORIGINS: "http://localhost:3000,https://zemin.depremzeminsorgulama.com,http://zemin.depremzeminsorgulama.com"
      GOOGLE_CLIENT_ID: "177597941513-u7madsiab1pu64q9hgnn0im79ge0qf8o.apps.googleusercontent.com"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: jet-grout-calc
    # ports kaldırıldı — DB sadece Docker internal network'ten erişilebilir
    # Dışarıdan bağlanmak için: docker compose exec db psql -U postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
